  let t;
  if(ch=='srv'){const r=await fetch('/api/db',{cache:'no-store'});if([404,405,501].includes(r.status)){SRVNO=1;throw new Error('NOAPI')}if(!r.ok)throw new Error('HTTP '+r.status);t=(await r.text()).trim()}
  else{const r=await fetch('https://api.github.com/gists/'+gcfg().id,{headers:GH(),cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),f=j.files&&j.files[GF];if(!f)return{state:null};
    t=f.content;if(f.truncated||t==null)t=await(await fetch(f.raw_url,{cache:'no-store'})).text()}
  let o=null;try{o=t?JSON.parse(t):null}catch(e){}return{state:okSt(o),raw:t}
}
async function rPut(ch,body){
  const r=ch=='srv'?await fetch('/api/db',{method:'POST',headers:{'Content-Type':'application/json'},body}):await fetch('https://api.github.com/gists/'+gcfg().id,{method:'PATCH',headers:{...GH(),'Content-Type':'application/json'},body:JSON.stringify({files:{[GF]:{content:body}}})});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
function applyRemote(o,ch){
  let n;try{n=norm(o)}catch(e){return false}
  if((D.updatedAt||0)>0||Object.keys(D.days||{}).length>1){try{localStorage.setItem(K4+'-pre-sync',JSON.stringify(D))}catch(e){}}   // safety copy of what gets replaced
  n.tm=D.tm||null;n.updatedAt=Nx(o.updatedAt,0,4e12,0);   // a running timer belongs to this device only
  _adopt=1;try{D=n;wbCalc();if(D.asc<0)D.asc=rkRaw(xpOf());fixAsc();ensureDay();chkAch();_pris=false;render();_sig=sigOf();try{localStorage.setItem(K4,JSON.stringify(D))}catch(e){}}finally{_adopt=0}
  toast('☁️ نسخهٔ جدیدتر از '+(ch=='srv'?'سرور':'Gist')+' دریافت شد');return true;
}
async function reconcile(ch){
  if(ch=='srv'?!srvOn():!gistOn())return;
  if(SBY[ch]){SRR[ch]=1;return}SBY[ch]=1;
  try{
    const{state:rs,raw}=await rGet(ch),lu=D.updatedAt||0;
    if(rs&&rs.updatedAt>lu){if(applyRemote(rs,ch))setSt(ch,'✅ دریافت شد · '+tnow());SB[ch]=rs.updatedAt}
    else if(!rs||lu>rs.updatedAt){
      if(rs&&SB[ch]>0&&rs.updatedAt>SB[ch]){try{localStorage.setItem(K4+'-remote-'+ch,raw||'')}catch(e){}toast('⚠️ هم‌زمان روی دستگاه دیگر هم تغییر ایجاد شده بود؛ نسخهٔ جدیدتر برنده شد و نسخهٔ قبلی بکاپ شد')}
      if(_pris||!D.updatedAt)D.updatedAt=Date.now();
      const at=D.updatedAt;await rPut(ch,JSON.stringify(D));SB[ch]=at;setSt(ch,'☁️ ارسال شد · '+tnow());
    }else{SB[ch]=lu;setSt(ch,'✅ همگام · '+tnow())}
    _pris=false;
  }catch(e){setSt(ch,e.message=='NOAPI'?'سرور /api/db در دسترس نیست':'⚠️ '+e.message);if(e.message=='NOAPI'&&!gistOn())_pris=false}
  SBY[ch]=0;if(SRR[ch]){SRR[ch]=0;reconcile(ch)}
}
const sched=(ch,ms)=>{clearTimeout(SYT[ch]);SYT[ch]=setTimeout(()=>{SYT[ch]=0;reconcile(ch)},ms)};
const schedSync=()=>{if(srvOn())sched('srv',500);if(gistOn())sched('gist',3000)};
const syncAll=f=>{if(!f&&Date.now()-_lastSync<1e4)return;_lastSync=Date.now();if(srvOn())reconcile('srv');if(gistOn())reconcile('gist')};
const flushSync=()=>['srv','gist'].forEach(ch=>{if(SYT[ch]){clearTimeout(SYT[ch]);SYT[ch]=0;reconcile(ch)}});
A.gsave=()=>{const t=($('gtk').value||'').trim(),i=($('gid').value||'').trim();try{localStorage.setItem(GK,JSON.stringify({token:t,id:i}))}catch(e){}toast('✅ تنظیمات ابری ذخیره شد');syncAll(true);render()};
A.gsync=()=>{toast('🔄 در حال همگام‌سازی…');syncAll(true)};
A.gclear=()=>{try{localStorage.removeItem(GK)}catch(e){}SY.gist='';toast('اتصال Gist قطع شد');render()};
A.gcreate=async()=>{
  const t=($('gtk').value||'').trim();if(!t)return toast('ابتدا GitHub Token را وارد کن');
  try{if(!D.updatedAt)D.updatedAt=Date.now();
    const r=await fetch('https://api.github.com/gists',{method:'POST',headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({description:'Cultivation RPG sync (private)',public:false,files:{[GF]:{content:JSON.stringify(D)}}})});
    if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
    localStorage.setItem(GK,JSON.stringify({token:t,id:j.id}));SB.gist=D.updatedAt;toast('✅ Gist خصوصی ساخته شد');render();syncAll(true);
  }catch(e){toast('❌ ساخت Gist ناموفق: '+e.message)}
};
const syncCard=()=>{const c=gcfg(),h=/^https?:$/.test(location.protocol);return `<section class="g p-4 space-y-2">${hd('cloud','☁️ سینک ابری خودکار (GitHub Gist)')}<div class="text-[11px] text-slate-400">🖥️ سرور لوکال (/api/db): <span id="sy-srv">${esc(h?(SRVNO?'در دسترس نیست':SY.srv||'در انتظار'):'غیرفعال (صفحه از فایل باز شده)')}</span></div><label class="text-xs text-slate-400 block">GitHub Token (دسترسی gist)<input id="gtk" type="password" autocomplete="off" value="${esc(c.token)}" placeholder="ghp_… یا github_pat_…"></label><label class="text-xs text-slate-400 block">Gist ID<input id="gid" value="${esc(c.id)}" placeholder="خالی بگذار و «ساخت خودکار» را بزن"></label><div class="flex flex-wrap gap-2"><button class="btn btn-p" data-a="gcreate">✨ ساخت خودکار Gist خصوصی</button><button class="btn" data-a="gsave">ذخیره</button><button class="btn" data-a="gsync">🔄 همگام‌سازی</button><button class="btn" data-a="gclear">قطع اتصال</button></div><div class="text-[11px] text-slate-400">وضعیت Gist: <span id="sy-gist">${esc(SY.gist||(gistOn()?'در انتظار':'غیرفعال'))}</span></div><div class="text-[11px] text-slate-400">توکن فقط در همین مرورگر می‌ماند و در Export نمی‌آید. در تعارض دو دستگاه، نسخهٔ جدیدتر برنده است و نسخهٔ بازنویسی‌شده بکاپ می‌شود. تایمر در حال اجرا فقط روی همان دستگاه می‌ماند.</div></section>`};

/* ================= init ================= */
_pris=!(localStorage.getItem(K4)||localStorage.getItem(K3)||localStorage.getItem(K2)||localStorage.getItem(K1))&&(srvOn()||gistOn());
D=load();wbCalc();if(D.asc<0)D.asc=rkRaw(xpOf());fixAsc();ensureDay();chkAch();TMR.restore();save();render();_sig=sigOf();setTimeout(syncAll,300,true);
setInterval(()=>{if(ensureDay()){save();render()}},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ensureDay()){save();render()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSync();else syncAll()});
setInterval(()=>{if(!document.hidden)syncAll()},60000);
</script>
